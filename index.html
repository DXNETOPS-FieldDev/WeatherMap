<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetOps WeatherMap</title>
  </head>
  <body>
    <!-- React replaces this placeholder the instant it mounts, so it's
         invisible in normal operation. If you're seeing this text in a
         browser, this is unbuilt source code deployed as-is — download
         the pre-built WeatherMap.zip from this repo's Releases page and
         deploy that instead; see the README. -->
    <div id="root">
      <!-- Styling lives on this inner div, NOT on #root itself: React
           replaces #root's children on mount but never its own attributes,
           so any inline style here would permanently constrain the live
           app's layout. -->
      <div style="font-family: sans-serif; max-width: 32rem; margin: 3rem auto; padding: 1rem;">
        <strong>This is unbuilt WeatherMap source code, not the deployable app.</strong>
        <p>Download the pre-built <code>WeatherMap.zip</code> from this repository's Releases page and deploy that instead — see the README's Install section.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
